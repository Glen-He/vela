[design.screen]
# 单点和组合都先采用同一固定骨架、局部重排的成对界面筛查合同。
parallel_tasks = 1
neighbor_distance_A = 8.0
score_function = "ref2015"
ranking_score = "dG_separated"
pack_separated = true

[design.combination]
# 多突变只由已通过单点门槛的替换提出，随后必须作为完整序列重新计算。
min_mutations = 2
max_mutations = 3
max_options_per_position = 3
max_candidates = 96

[design.iteration]
# 每代只探索父序列的一步邻域；累计突变上限与单代任务预算分开控制。
max_parents = 4
max_total_mutations = 5
max_candidates = 256

[design.finalists]
# 组合初筛后只让有限候选进入昂贵的多 seed FlexPepDock 柔性复核。
parallel_tasks = 1
max_candidates = 12
max_md_candidates = 5
seeds = []
ranking_score = "reweighted_sc"
interface_score = "I_sc"
calibrated = false
min_passed_decoy_fraction = "unresolved"
min_successful_seeds = "unresolved"
max_positive_median_ranking_delta = "unresolved"
max_positive_worst_ranking_delta = "unresolved"
max_positive_median_interface_delta = "unresolved"
max_positive_worst_interface_delta = "unresolved"
