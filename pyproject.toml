[project]
name = "vela"
version = "0.1.0"
description = "Reproducible cyclic-peptide binding-site discovery for CK2 catalytic subunits"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gemmi>=0.7.5,<0.8",
]

[project.scripts]
vela = "vela.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests", "scripts"]
stubPath = "typings"
executionEnvironments = [
    { root = "src", extraPaths = ["src"] },
    { root = "tests", extraPaths = ["src"] },
    { root = "scripts" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]
